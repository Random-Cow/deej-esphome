esphome:
  name: esphome-web-aaaaaa
  friendly_name: Deej Volume Control

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

ota:

web_server:
  port: 80
  ota: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # Shared filter chain for all slider inputs, defined once and reused below via
  # the "*input_filters" YAML alias so adding sliders doesn't require copying this block.
  - platform: adc
    pin: GPIO35
    id: Input_0
    name: "Input 0"
    attenuation: auto
    update_interval: 20ms
    filters: &input_filters
      # Reject brief noise spikes (e.g. from WiFi TX activity) before averaging
      - median:
          window_size: 5
          send_every: 1
      # Average out some noise
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
      # DC offset to get value beteen 0 -> 3 (with some overlap on both sides for deadzones)
      - offset: -0.1
      # Multiply to get a value between 0 -> 1023 (as required by Deej)
      - multiply: 341
      # Ignore small differences (<0.5%) - the median filter above already rejects spike
      # noise, so this shouldn't need to be raised further; it just cleans up the logs a bit
      - delta: 5.0
      # Clamp to between 0 and 1023. Values outside of this range are considered deadzones
      - clamp:
          min_value: 0
          max_value: 1023
      # Remove decimals
      - round: 0

  # Additional sliders only need pin/id/name; the filter chain is inherited via the alias above.
  - platform: adc
    pin: GPIO34
    id: Input_1
    name: "Input 1"
    attenuation: auto
    update_interval: 20ms
    filters: *input_filters
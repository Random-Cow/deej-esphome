name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l pkg)" || (gofmt -l pkg; exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        run: go test -race ./...

      - name: Build (linux/amd64, linux/arm64)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o dist/deej-linux-$arch ./pkg/deej/cmd
          done

  esphome:
    name: ESPHome example config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate esphome/deej-esphome.yaml
        working-directory: esphome
        run: |
          printf 'wifi_ssid: ci\nwifi_password: ci-password\n' > secrets.yaml
          esphome config deej-esphome.yaml > /dev/null

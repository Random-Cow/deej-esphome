# Process names are case-insensitive.
# Glob patterns are supported: "firefox*" matches firefox, Web Content, firefox-esr, etc.
# Special targets:
#   master          - master output volume
#   mic             - microphone input level
#   deej.unmapped   - all apps not explicitly mapped to any slider
# Slider indexes start at 0.
slider_mapping:
  0: firefox*
  1: spotify
  2: discord
  3: deej.unmapped
  4: master

# Set to true to invert the controls (top = 0%, bottom = 100%).
invert_sliders: false

# ESPHome device settings
esphome_ip: deej.local   # hostname (mDNS), IP or host:port

# ESPHome sensor entity IDs, matched against the sanitized (lowercase,
# underscored) entity name reported by ESPHome, e.g. "Input 0" -> input_0.
# Works with both the legacy and the current ESPHome id format automatically.
esphome_mapping:
  - input_0
  - input_1
  - input_2
  - input_3
  - input_4

# Signal noise reduction: "low" (good hardware), "default", or "high" (noisy hardware).
noise_reduction: default
